    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Auto High-Definition URL Enhancer (FHD)
        const getFhdImageUrl = (url) => {
            if (!url || typeof url !== 'string') return '';
            let clean = url.trim();
            if (clean.includes('cloudinary.com') && clean.includes('/upload/')) {
                return clean.replace('/upload/', '/upload/f_auto,q_auto:best,w_1080/');
            }
            return clean;
        };


        const playAppPushSound = () => {
            try {
                if (navigator.vibrate) {
                    navigator.vibrate([150, 75, 150]);
                }
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(659.25, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.12);
                gain.gain.setValueAtTime(0.3, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.35);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.35);
            } catch(e) {}
        };

        const toArray = (data) => {
            if (!data) return [];
            if (Array.isArray(data)) return data.filter(Boolean);
            if (typeof data === 'object') return Object.values(data).filter(Boolean);
            return [];
        };

        const cleanMatchTime = (timeStr) => {
            if (!timeStr) return '';
            const parts = timeStr.trim().split(' ');
            const timePart = parts[0];
            let ampmPart = parts[1] || '';

            if (!timePart.includes(':')) return timeStr;

            let [h, m] = timePart.split(':');
            let hour = parseInt(h, 10);
            if (isNaN(hour)) return timeStr;

            if (hour >= 12) {
                ampmPart = 'PM';
                if (hour > 12) hour = hour - 12;
            } else if (hour === 0) {
                hour = 12;
                ampmPart = 'AM';
            } else if (!ampmPart) {
                ampmPart = 'AM';
            }

            const formattedH = String(hour).padStart(2, '0');
            const formattedM = m ? String(m).padStart(2, '0') : '00';
            return `${formattedH}:${formattedM} ${ampmPart.toUpperCase()}`;
        };

        const getMatchStartEpoch = (dateStr, timeStr) => {
            try {
                if (!dateStr || !timeStr) return null;
                const normalizedDate = dateStr.trim().replace(/\//g, '-');
                const dateParts = normalizedDate.split('-');
                let y, m, d;
                if (dateParts[0].length === 4) {
                    y = parseInt(dateParts[0], 10);
                    m = parseInt(dateParts[1], 10) - 1;
                    d = parseInt(dateParts[2], 10);
                } else {
                    d = parseInt(dateParts[0], 10);
                    m = parseInt(dateParts[1], 10) - 1;
                    y = parseInt(dateParts[2], 10);
                }

                const timeParts = timeStr.trim().split(' ');
                const [rawH, rawMin] = (timeParts[0] || '').split(':');
                let h = parseInt(rawH, 10);
                const min = parseInt(rawMin || '0', 10);
                const ampm = (timeParts[1] || '').toUpperCase();

                if (isNaN(h)) return null;
                if (ampm === 'PM' && h < 12) h += 12;
                if (ampm === 'AM' && h === 12) h = 0;

                const matchEpoch = new Date(y, m, d, h, min, 0, 0).getTime();
                return isNaN(matchEpoch) ? null : matchEpoch;
            } catch(e) {
                return null;
            }
        };

        const DigitalRoomTimer = ({ matchEpoch }) => {
            const [diffSec, setDiffSec] = useState(() => {
                if (!matchEpoch) return null;
                return Math.floor((matchEpoch - Date.now()) / 1000);
            });

            useEffect(() => {
                if (!matchEpoch) return;
                const update = () => {
                    setDiffSec(Math.floor((matchEpoch - Date.now()) / 1000));
                };
                update();
                const interval = setInterval(update, 1000);
                return () => clearInterval(interval);
            }, [matchEpoch]);

            if (diffSec === null) return null;

            const remaining = Math.max(0, diffSec);
            const hrs = Math.floor(remaining / 3600);
            const mins = Math.floor((remaining % 3600) / 60);
            const secs = remaining % 60;

            const strH = String(hrs).padStart(2, '0');
            const strM = String(mins).padStart(2, '0');
            const strS = String(secs).padStart(2, '0');

            return (
                <div className="flex flex-col items-center justify-center py-2 select-none">
                    <div className="font-mono text-4xl sm:text-5xl font-light tracking-tight flex items-center justify-center">
                        <span className={hrs === 0 ? "text-slate-500" : "text-white"}>{strH}</span>
                        <span className="text-slate-500 mx-1">:</span>
                        <span className={hrs === 0 && mins === 0 ? "text-slate-500" : "text-white"}>{strM}</span>
                        <span className="text-slate-500 mx-1">:</span>
                        <span className="text-white font-normal">{strS}</span>
                    </div>
                    {diffSec <= 0 && (
                        <span className="text-[10px] text-amber-400 font-bold uppercase tracking-wider mt-2 animate-pulse">
                            Creating room... Please wait!
                        </span>
                    )}
                </div>
            );
        };

            const isCS = cat.includes('CS') || cat.includes('CLASH') || title.includes('CS') || title.includes('CLASH');

            const isVersus = cat.includes('1V1') || cat.includes('2V2') || title.includes('1V1') || title.includes('2V2');
            const isFreeTwoTeam = (cat.includes('FREE') || title.includes('FREE')) && (cat.includes('TEAM') || title.includes('TEAM') || isCS || isLW || isVersus);

            return isCS || isLW || isVersus || isFreeTwoTeam;

        const UserApp = () => {

                if (isWithdrawingNow) return;
                
                if (!hasDepositedOnce) {

                    setShowWithdraw(false);
                    setShowAddMoney(true);
                    setDepositStep('select');
                    setDepositAmt('10');
                    return;
                }

                const amt = parseInt(withdrawAmt);
                const upi = withdrawUpi.trim();
                if(!amt || amt < 50) return showToast("Minimum withdrawal is ₹50!");
                if(amt > realWithdrawableCash) {
                    return showToast(`Insufficient balance! Aap maximum ₹${realWithdrawableCash.toFixed(2)} hi withdraw kar sakte hain.`);
                }
                if(!upi || !upi.includes('@')) return showToast("Please enter a valid UPI ID (e.g. mobile@upi)!");

                setIsWithdrawingNow(true);

                try {
                    const userRef = db.ref(`warrior_adda/users/${user.phone}`);
                    const snap = await userRef.once('value');
                    const uData = snap.val() || {};
                    const curBal = Number(uData.wallet) || 0;

                    if (curBal >= amt) {
                        const newBal = curBal - amt;
                        await userRef.update({ wallet: newBal });
                        setWalletVal(newBal);

                        const witId = 'wit_' + Date.now();
                        const currentDate = new Date().toLocaleDateString();
                        const newWObj = { id: witId, user: user.phone, amount: amt, upi: upi, status: 'Pending', date: currentDate };

                        await db.ref(`warrior_adda/withdrawals/${witId}`).set(newWObj);

                        const updatedWits = [newWObj, ...toArray(uData.userWithdrawals)];
                        await userRef.update({ userWithdrawals: updatedWits });

                        setShowWithdraw(false);
                        setWithdrawSuccessData({ amount: amt, upi: upi, date: currentDate });
                        setWithdrawAmt('');
                        setWithdrawUpi('');
                    } else {
                        showToast("Insufficient balance in wallet!");
                    }
                } catch(e) {
                    showToast("Withdrawal failed: " + e.message);
                }

                setIsWithdrawingNow(false);
            };

            const confirmJoinFinal = async () => {
                if (isJoiningTournament) return;
                const ign = (gameIgn || '').trim();
                if (!ign) return showToast("Enter Game Name (IGN)!");
                
                const t = joiningTournament;
                if (!t) return;
                const slotNum = parseInt(selectedSlot);
                if (!slotNum || isNaN(slotNum)) return showToast("Please select a valid slot!");

                setIsJoiningTournament(true);

                try {
                    const userRef = db.ref(`warrior_adda/users/${user.phone}`);
                    const userSnap = await userRef.once('value');
                    const userData = userSnap.val() || {};
                    const currentBal = Number(userData.wallet) || 0;
                    const entryFee = Number(t.entry) || 0;

                    if (currentBal < entryFee) {
                        setIsJoiningTournament(false);
                        return showToast("Insufficient Balance! Please add money to wallet.");
                    }

                    const tourRef = db.ref(`warrior_adda/tournaments/${t.id}`);
                    const tourSnap = await tourRef.once('value');
                    const currentTour = tourSnap.val();

                    if (!currentTour) {
                        setIsJoiningTournament(false);
                        return showToast("Match not found, please try again!");
                    }

                    const booked = toArray(currentTour.bookedSlots).map(Number);
                    const maxSlots = Number(currentTour.slots) || 48;

                    if (booked.length >= maxSlots) {
                        setIsJoiningTournament(false);
                        return showToast("Match full ho chuka hai!");
                    }

                    if (booked.includes(slotNum)) {
                        setIsJoiningTournament(false);
                        return showToast("Ye slot pehle se book ho chuka hai!");
                    }

                    const updatedBal = currentBal - entryFee;
                    await userRef.update({ wallet: updatedBal });
                    setWalletVal(updatedBal);

                    const updatedBooked = [...booked, slotNum];
                    const updatedParts = [...toArray(currentTour.participants), {
                        slot: slotNum,
                        phone: user.phone,
                        username: user.username,
                        ign: ign
                    }];

                    await tourRef.update({
                        joinedCount: updatedBooked.length,
                        bookedSlots: updatedBooked,
                        participants: updatedParts
                    });

                    const userMatches = [...new Set([...toArray(userData.myMatches).map(String), String(t.id)])];
                    await userRef.update({ myMatches: userMatches });
                    setMyMatchesVal(userMatches);

                    setShowAddInfoModal(false);
                    setJoiningTournament(null);
                    setJoinSuccessData(t);
                    showToast("Match Successfully Joined!");

                    alert("Join Error: " + e.message);
                    showToast("Error: " + e.message);

                                        value={withdrawAmt} 
                                        onChange={(e) => { const v = e.target.value; setWithdrawAmt(v); }} 
                                        placeholder="Enter amount" 
                                        className="w-full bg-white text-gray-900 py-2 border-b border-gray-400 focus:border-black outline-none text-sm font-bold transition"
                                    />
                                </div>

                                <div className="grid grid-cols-4 gap-2.5">
                                    {[50, 100, 150, 200].map((amt) => (
                                        <button 
                                            key={amt}
                                            type="button"
                                            onClick={() => setWithdrawAmt(String(amt))}
                                            className={`py-3 rounded-xl border text-sm font-bold transition active:scale-95 cursor-pointer ${
                                                Number(withdrawAmt) === amt 
                                                    ? 'bg-black text-white border-black shadow-md' 
                                                    : 'bg-white text-gray-800 border-gray-300 hover:border-gray-500'
                                            }`}>
                                            {amt}
                                        </button>
                                    ))}
                                </div>

                                <div className="pt-8">
                                    <button 
                                        type="button" 
                                        disabled={isWithdrawingNow}
                                        onClick={handleWithdrawSubmit} 
                                        className="w-full bg-[#3bf19c] hover:bg-[#2fe08c] text-white font-black py-4 rounded-2xl text-sm tracking-wide shadow-md active:scale-[0.98] transition cursor-pointer flex items-center justify-center gap-2 disabled:opacity-50">
                                        {isWithdrawingNow ? (
                                            <>
                                                <i className="fa-solid fa-spinner fa-spin"></i>
                                                <span>SUBMITTING REQUEST...</span>
                                            </>
                                        ) : (
                                            <span>WITHDRAW WINNING CASH</span>
                                        )}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    <div className="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md bg-[#16213e] border-t border-gray-800 flex justify-around items-center py-2.5 z-20 shadow-2xl">
                        <button 
                            onClick={() => { setUserNav('earn'); setSelectedCategory(null); setDetailedMatch(null); setViewingResultMatch(null); }} 
                            className={`flex flex-col items-center justify-center w-20 cursor-pointer transition ${userNav === 'earn' ? 'text-[#a855f7]' : 'text-gray-400'}`}>
                            <i className="fa-solid fa-gift text-lg mb-0.5"></i>
                            <span className="text-[10px] font-bold">Earn</span>
                        </button>

                        <button 
                            onClick={() => { setUserNav('play'); setSelectedCategory(null); setDetailedMatch(null); setViewingResultMatch(null); }} 
                            className={`flex flex-col items-center justify-center w-20 cursor-pointer transition ${userNav === 'play' || userNav === 'matches' ? 'text-[#a855f7]' : 'text-gray-400'}`}>
                            <div className={`p-1 rounded-xl ${userNav === 'play' ? 'bg-[#7c3aed]/20' : ''}`}>
                                <i className="fa-solid fa-gamepad text-lg mb-0.5"></i>
                            </div>
                            <span className="text-[10px] font-bold">Play</span>
                        </button>

                        <button 
                            onClick={() => { setUserNav('account'); setSelectedCategory(null); setDetailedMatch(null); setViewingResultMatch(null); }} 
                            className={`flex flex-col items-center justify-center w-20 cursor-pointer transition ${userNav === 'account' ? 'text-[#a855f7]' : 'text-gray-400'}`}>
                            <i className="fa-solid fa-user text-lg mb-0.5"></i>
                            <span className="text-[10px] font-bold">Account</span>
                        </button>
                    </div>
                </div>
            );
        };

        const rootEl = document.getElementById('root');
        if (rootEl) {
            ReactDOM.createRoot(rootEl).render(<UserApp />);
        }
    </script>
</body>
</html>
